<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v=maple-english-20261007" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/maple-mono-nl-nf-cn-regular-base.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=maple-english-20261007">
{% if page.math %}<script defer src="https://cdn.jsdelivr.net/npm/mathjax@2.7.9/MathJax.js?config=TeX-AMS_CHTML"></script>{% endif %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header>
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">Z</span>{{ site.title | escape }}<span class="brand-note"> / NOTES</span></a>
      <nav aria-label="Main navigation">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Posts</a>
        <a {% if page.url == '/archive/' %}aria-current="page"{% endif %} href="{{ '/archive/' | relative_url }}">Archive</a>
        <a {% if page.url == '/about/' %}aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
        <a {% if page.url == '/ctf/' %}aria-current="page"{% endif %} href="{{ '/ctf/' | relative_url }}">CTF</a>
        <a href="https://github.com/Zr4NF">GitHub</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer><span>© {{ site.time | date: '%Y' }} Zr4NF</span></footer>
  </div>
</body>
</html>
