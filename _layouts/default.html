<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v=blue-20261007" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=blue-20261007">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="shell">
    <header>
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">Z</span>{{ site.title | escape }}<span class="brand-note"> / NOTES</span></a>
      <nav aria-label="主导航">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">文章</a>
        <a {% if page.url == '/archive/' %}aria-current="page"{% endif %} href="{{ '/archive/' | relative_url }}">归档</a>
        <a {% if page.url == '/about/' %}aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">关于</a>
        <a href="https://github.com/Zr4NF">GitHub</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer><span>© {{ site.time | date: '%Y' }} Zr4NF</span><span>持续学习，认真记录。</span></footer>
  </div>
</body>
</html>
